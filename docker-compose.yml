version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    environment:
      FLASK_ENV: development
      FLASK_APP: run.py
      PORT: 5050
      DATABASE_URL: sqlite:///goodcheck.db
      SECRET_KEY: your-secret-key-change-in-production
      JWT_SECRET_KEY: your-jwt-secret-key-change-in-production
    volumes:
      - ./backend:/app
    command: python run.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: python:3.11-slim
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./UI1:/app
    command: python -m http.server 8000
    depends_on:
      - backend
